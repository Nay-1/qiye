server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: qiye-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/qiye
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
    banner: false

# JWT 配置
jwt:
  # 生产环境务必替换为随机长字符串
  secret: ${JWT_SECRET:QiYeTraInInG2026SuPeRSeCrEtKeY99!@#LongEnough32Bytes}
  expire-hours: 24

# AI 配置（多 provider 可切换 + mock 降级）
ai:
  # provider: mock | opencode | dashscope
  # mock = 无 Key 时的预设回复，跑通业务；配好 Key 后切 opencode/dashscope
  provider: ${AI_PROVIDER:opencode}
  timeout-seconds: 60
  # OpenCode Go（对话/出题/建议文案，OpenAI 兼容）
  # Key 通过环境变量或 backend/.env（start-backend.sh 自动加载）提供
  opencode:
    base-url: https://opencode.ai/zen/go/v1
    api-key: ${OPENCODE_API_KEY:}
    chat-model: deepseek-v4-flash
  # DashScope / Qwen（向量化 embedding，OpenAI 兼容）
  dashscope:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    embedding-model: text-embedding-v3

# 文件上传存储目录（知识库文档）
app:
  upload-dir: ${UPLOAD_DIR:./data/upload}
