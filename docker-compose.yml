# 企业岗位技能培训与智能考核系统 - PostgreSQL + pgvector 单库部署
# 用法：docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qiye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qiye
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - qiye_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qiye"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  qiye_pgdata:
